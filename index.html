<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>第14回日本制服アワード エントリーフォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    
    :root {
      --primary-pink: #e6005c;
      --accent-red: #ff3366;
      --bg-light: #fff5f7;
      --card-bg: #ffffff;
      --text-main: #333333;
      --border-color: #ffccd5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-light);
      background-image: radial-gradient(circle at 50% 0%, #ffe6eb 0%, var(--bg-light) 100%);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .hero-header { text-align: center; margin-bottom: 20px; }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, var(--primary-pink), var(--accent-red));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .main-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--primary-pink);
      line-height: 1.3;
    }

    .form-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 18px;
      box-shadow: 0 10px 25px rgba(230, 0, 92, 0.08);
    }

    .status-bar {
      text-align: center;
      background: #fff0f3;
      color: var(--primary-pink);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      font-weight: 700;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: flex;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #444;
      margin-bottom: 8px;
    }

    .req {
      background: var(--primary-pink);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }

    input[type="text"], input[type="date"] {
      width: 100%;
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: #333;
      font-size: 1rem;
      outline: none;
      font-family: inherit;
    }

    input[type="text"]:focus, input[type="date"]:focus {
      border-color: var(--primary-pink);
      background: #fff;
    }

    .radio-group { display: flex; gap: 10px; }

    .radio-btn {
      flex: 1;
      text-align: center;
      background: #fafafa;
      border: 1px solid var(--border-color);
      padding: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
      font-weight: 700;
    }

    .radio-btn input { display: none; }

    .radio-btn:has(input:checked) {
      background: var(--primary-pink);
      border-color: var(--primary-pink);
      color: #fff;
    }

    #agencyNameGroup { display: none; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary-pink) 0%, var(--accent-red) 100%);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 0, 92, 0.3);
      margin-top: 10px;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--primary-pink);
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    /* 回答済み画面用のスタイル */
    .already-submitted {
      display: none;
      text-align: center;
      padding: 30px 10px;
    }
    .already-submitted h2 {
      color: var(--primary-pink);
      font-size: 1.3rem;
      margin-bottom: 12px;
    }
    .already-submitted p {
      color: #666;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="hero-header">
    <div class="badge">第14回</div>
    <h1 class="main-title">日本制服アワード<br>エントリー登録</h1>
  </div>

  <div class="form-card">
    <div id="statusMessage" class="status-bar">LINE連携を確認中...🔄</div>

    <!-- フォーム本体 -->
    <form id="auditionForm">
      <div class="form-group">
        <label>本名 <span class="req">必須</span></label>
        <input type="text" id="realName" placeholder="例：山田 花子" required>
      </div>

      <div class="form-group">
        <label>生年月日 <span class="req">必須</span></label>
        <!-- ★カレンダー選択式に変更★ -->
        <input type="date" id="birthDate" required>
      </div>

      <div class="form-group">
        <label>事務所所属 <span class="req">必須</span></label>
        <div class="radio-group">
          <label class="radio-btn"><input type="radio" name="agency" value="あり" onchange="toggleAgencyInput(true)" required>あり</label>
          <label class="radio-btn"><input type="radio" name="agency" value="なし" onchange="toggleAgencyInput(false)">なし</label>
        </div>
      </div>

      <!-- ★「あり」を押したときだけ表示される入力欄★ -->
      <div class="form-group" id="agencyNameGroup">
        <label>事務所名 <span class="req">必須</span></label>
        <input type="text" id="agencyName" placeholder="例：○○プロダクション">
      </div>

      <button type="button" class="submit-btn" id="submitBtn" onclick="submitData()">エントリー完了</button>
      <div id="loading" class="loading">送信中...✨</div>
    </form>

    <!-- ★重複回答時の表示用コンテナ★ -->
    <div id="alreadySubmitted" class="already-submitted">
      <h2>✅ すでに回答済みです</h2>
      <p>ご登録ありがとうございます！<br>エントリー情報はすでに正常に受け付けられております。</p>
    </div>
  </div>

  <script>
    const LIFF_ID = "2011615012-KQalAnEM";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyOlALG5EBN8I8dD03gLU3scAyoZ2CtYJPxZuWF_zCLZivRXBgWKmiBPvr-m36rMUGKBA/exec";

    let lineUserId = "";
    let lineDisplayName = "";

    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          liff.getProfile()
            .then(profile => {
              lineUserId = profile.userId;
              lineDisplayName = profile.displayName;
              
              // 重複チェック実行
              checkAlreadySubmitted(profile.userId, profile.displayName);
            })
            .catch(err => {
              document.getElementById("statusMessage").innerText = "❌ プロフィール取得失敗: " + err.message;
            });
        })
        .catch(err => {
          document.getElementById("statusMessage").innerText = "❌ LIFF初期化エラー: " + err.message;
        });
    });

    // 事務所名入力欄の表示制御
    function toggleAgencyInput(show) {
      const group = document.getElementById("agencyNameGroup");
      const input = document.getElementById("agencyName");
      if (show) {
        group.style.display = "block";
        input.required = true;
      } else {
        group.style.display = "none";
        input.required = false;
        input.value = "";
      }
    }

    // 重複回答チェック関数
    function checkAlreadySubmitted(userId, displayName) {
      fetch(`${GAS_URL}?userId=${encodeURIComponent(userId)}`)
        .then(res => res.json())
        .then(data => {
          if (data.isSubmitted) {
            // すでに回答済みの場合はフォームを隠して案内文を表示
            document.getElementById("auditionForm").style.display = "none";
            document.getElementById("statusMessage").style.display = "none";
            document.getElementById("alreadySubmitted").style.display = "block";
          } else {
            document.getElementById("statusMessage").innerText = "🌸 " + displayName + " 様のエントリー";
          }
        })
        .catch(() => {
          document.getElementById("statusMessage").innerText = "🌸 " + displayName + " 様のエントリー";
        });
    }

    // エントリー送信処理（爆速化）
    function submitData() {
      const form = document.getElementById("auditionForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      document.getElementById("loading").style.display = "block";

      const payload = {
        userId: lineUserId,
        displayName: lineDisplayName,
        realName: document.getElementById("realName").value,
        birthDate: document.getElementById("birthDate").value,
        agency: document.querySelector('input[name="agency"]:checked')?.value,
        agencyName: document.getElementById("agencyName").value
      };

      // ★爆速化：レスポンスを待たずに即時送信を開始してバックグラウンドで処理
      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });

      // ユーザーを待たせずにすぐ自動発言＆画面閉じを実行
      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: '回答しました！' }])
          .then(() => liff.closeWindow())
          .catch(() => liff.closeWindow());
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
