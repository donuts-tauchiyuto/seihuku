<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>第14回日本制服アワード 登録フォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap');
    :root { --primary-red: #ff003c; --accent-gold: #ffd700; --bg-dark: #0b0b10; --card-bg: rgba(20, 20, 28, 0.95); --input-bg: #161622; --text-main: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.3) 0%, transparent 70%), linear-gradient(180deg, #050508 0%, var(--bg-dark) 100%); color: var(--text-main); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; padding: 24px 16px 40px; }
    .hero-header { text-align: center; margin-bottom: 24px; }
    .badge { display: inline-block; background: linear-gradient(90deg, var(--primary-red), #ff5e00); color: #fff; font-size: 0.75rem; font-weight: 900; padding: 4px 14px; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); letter-spacing: 2px; margin-bottom: 10px; }
    .main-title { font-size: 1.5rem; font-weight: 900; font-style: italic; line-height: 1.3; background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
    .form-card { background: var(--card-bg); border: 1px solid rgba(255, 0, 60, 0.3); border-radius: 12px; padding: 24px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
    .form-group { margin-bottom: 20px; }
    label { display: flex; align-items: center; font-size: 0.85rem; font-weight: 900; color: var(--accent-gold); margin-bottom: 8px; }
    .req { background: var(--primary-red); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; margin-left: 8px; }
    input[type="text"] { width: 100%; background: var(--input-bg); border: 1px solid #333348; border-radius: 8px; padding: 14px; color: #fff; font-size: 1rem; outline: none; }
    .radio-group { display: flex; gap: 8px; }
    .radio-btn { flex: 1; text-align: center; background: var(--input-bg); border: 1px solid #333348; padding: 12px 0; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: #aaa; }
    .radio-btn input { display: none; }
    .radio-btn:has(input:checked) { background: rgba(255, 0, 60, 0.2); border-color: var(--primary-red); color: #fff; font-weight: 900; }
    .submit-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #ff003c 0%, #ff5e00 100%); border: none; border-radius: 8px; color: #fff; font-size: 1.2rem; font-weight: 900; font-style: italic; letter-spacing: 2px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 0, 60, 0.5); margin-top: 10px; }
    .loading { display: none; text-align: center; color: var(--accent-gold); margin-top: 12px; font-size: 1rem; font-weight: bold; }
    .status-bar { text-align: center; background: rgba(0,0,0,0.8); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; border: 1px dashed var(--accent-gold); font-weight: bold; }
  </style>
</head>
<body>
  <div class="hero-header">
    <div class="badge">第14回</div>
    <h1 class="main-title">日本制服アワード<br>エントリー登録</h1>
  </div>
  <div class="form-card">
    <div id="statusMessage" class="status-bar">LINE連携を確認中...🔄</div>

    <form id="auditionForm">
      <div class="form-group"><label>本名 <span class="req">必須</span></label><input type="text" id="realName" placeholder="例：山田 花子" required></div>
      <div class="form-group"><label>生年月日 <span class="req">必須</span></label><input type="text" id="birthDate" placeholder="例：20020219" required></div>
      <div class="form-group">
        <label>事務所所属 <span class="req">必須</span></label>
        <div class="radio-group">
          <label class="radio-btn"><input type="radio" name="agency" value="あり" required>あり</label>
          <label class="radio-btn"><input type="radio" name="agency" value="なし">なし</label>
        </div>
      </div>
      <div class="form-group"><label>事務所名</label><input type="text" id="agencyName" placeholder="例：○○プロダクション（所属している場合のみ）"></div>
      
      <button type="button" class="submit-btn" id="submitBtn" onclick="submitData()">エントリー完了</button>
      <div id="loading" class="loading">データを送信中...<br>※少々お待ちください</div>
    </form>
  </div>

  <script>
    const LIFF_ID = "2011615012-KQalAnEM";
    // ★↓↓ お客様のGASのデプロイURLをここに貼り付けてください ↓↓★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyOlALG5EBN8I8dD03gLU3scAyoZ2CtYJPxZuWF_zCLZivRXBgWKmiBPvr-m36rMUGKBA/exec";
    
    let lineUserId = "";
    let lineDisplayName = "";

    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          liff.getProfile()
            .then(profile => {
              lineUserId = profile.userId;
              lineDisplayName = profile.displayName;
              document.getElementById("statusMessage").innerText = "✅ LINE連携完了！ " + profile.displayName + " 様";
              document.getElementById("statusMessage").style.borderColor = "#00ff00";
              document.getElementById("statusMessage").style.color = "#00ff00";
            })
            .catch(err => {
              document.getElementById("statusMessage").innerText = "❌ プロフィール取得失敗: " + err.message;
            });
        })
        .catch(err => {
          document.getElementById("statusMessage").innerText = "❌ LIFF初期化エラー: " + err.message;
        });
    });

    async function submitData() {
      const form = document.getElementById("auditionForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }
      
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      document.getElementById("loading").style.display = "block";

      const payload = {
        userId: lineUserId,
        displayName: lineDisplayName,
        realName: document.getElementById("realName").value,
        birthDate: document.getElementById("birthDate").value,
        agency: document.querySelector('input[name="agency"]:checked')?.value,
        agencyName: document.getElementById("agencyName").value
      };

      try {
        // ★GASのURLに向けてPOST通信でデータを投げ飛ばす！（成功パターンの仕組み）
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        document.getElementById("loading").innerHTML = "✅ 登録完了！<br>画面上部の「×」で閉じてください";
        document.getElementById("loading").style.color = "#00ff00";

        // GitHub環境なら安全に画面を閉じられます
        if (liff.isInClient()) {
          liff.closeWindow();
        }
      } catch (error) {
        document.getElementById("loading").innerHTML = "❌ 送信エラー: 通信に失敗しました";
        document.getElementById("loading").style.color = "#ff003c";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
