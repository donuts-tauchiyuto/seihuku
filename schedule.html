<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日程調整・お客様情報入力</title>
  
  <!-- カレンダーを強化するライブラリ（Flatpickr） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    :root { --primary-pink: #e6005c; --accent-red: #ff3366; --bg-light: #fff5f7; --card-bg: #ffffff; --text-main: #333333; --border-color: #ffccd5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #fafafa; color: var(--text-main); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; padding: 20px 16px 40px; }
    .form-card { background: var(--card-bg); border-radius: 16px; padding: 24px 18px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); width: 100%; max-width: 500px; margin: 0 auto; }
    .header-title { text-align: center; font-size: 1.3rem; font-weight: 900; color: var(--primary-pink); margin-bottom: 24px; }
    .profile-box { display: flex; align-items: center; background: #fff0f3; padding: 12px 16px; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border-color); }
    .profile-box img { width: 48px; height: 48px; border-radius: 50%; margin-right: 12px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(230, 0, 92, 0.2); }
    .profile-box span { font-size: 0.95rem; font-weight: 700; color: var(--primary-pink); }
    .form-group { margin-bottom: 20px; width: 100%; }
    label { display: flex; align-items: center; font-size: 0.9rem; font-weight: 700; color: #444; margin-bottom: 8px; }
    .req { color: var(--accent-red); margin-left: 4px; font-weight: 900; }
    input[type="text"], select { width: 100%; -webkit-appearance: none; appearance: none; background: #ffffff; border: 1px solid #ccc; border-radius: 8px; padding: 12px 14px; color: #333; font-size: 1rem; outline: none; font-family: inherit; box-sizing: border-box; min-height: 48px; }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 0 2px rgba(230, 0, 92, 0.1); }
    select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 40px; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary-pink) 0%, var(--accent-red) 100%); border: none; border-radius: 8px; color: #fff; font-size: 1.1rem; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(230, 0, 92, 0.3); margin-top: 16px; }
    .submit-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    /* カスタムポップアップ */
    .custom-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .custom-modal { background: #fff; width: 85%; max-width: 350px; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .custom-modal h3 { color: var(--primary-pink); margin-bottom: 12px; font-size: 1.2rem; }
    .custom-modal p { font-size: 0.95rem; color: #444; line-height: 1.5; margin-bottom: 20px; }
    .custom-modal button { background: var(--primary-pink); color: #fff; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="header-title">日程調整・お客様情報入力</div>

    <div class="profile-box">
      <img id="profileImage" src="https://via.placeholder.com/48" alt="Profile">
      <span id="profileName">読み込み中...</span>
    </div>

    <form id="scheduleForm">
      <div class="form-group">
        <label>お名前 <span class="req">*</span></label>
        <input type="text" id="userName" placeholder="例：山田 花子" required>
      </div>

      <div class="form-group">
        <label>希望日（平日のみ） <span class="req">*</span></label>
        <input type="text" id="dateSelect" placeholder="日付を選択してください" readonly required>
      </div>

      <div class="form-group">
        <label>希望時間帯 <span class="req">*</span></label>
        <select id="timeSelect" required>
          <option value="" disabled selected>選択してください</option>
          <option value="10:00 〜 11:00">10:00 〜 11:00</option>
          <option value="17:00 〜 18:00">17:00 〜 18:00</option>
          <option value="18:00 〜 19:00">18:00 〜 19:00</option>
        </select>
      </div>

      <button type="button" class="submit-btn" id="submitBtn" onclick="submitSchedule()">この内容で送信してチャットへ</button>
    </form>
  </div>

  <div id="customModal" class="custom-modal-overlay">
    <div class="custom-modal">
      <h3 id="modalTitle">通知</h3>
      <p id="modalMessage">メッセージ</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    // ★★★ここに新しく作成した「日程調整用のLIFF ID」を入れてください★★★
    const LIFF_ID = "2011615012-3T727ZCa"; 

    document.addEventListener("DOMContentLoaded", function() {
      // 祝日APIから日本の祝日データを取得
      fetch("https://holidays-jp.github.io/api/v1/date.json")
        .then(response => response.json())
        .then(holidays => {
          // カレンダー（Flatpickr）の初期設定
          flatpickr("#dateSelect", {
            locale: "ja",
            minDate: "today",
            disable: [
              function(date) {
                // 土日判定（0:日曜日, 6:土曜日）
                if (date.getDay() === 0 || date.getDay() === 6) return true;
                
                // 祝日判定
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                const formattedDate = `${y}-${m}-${d}`;
                
                return holidays.hasOwnProperty(formattedDate); // 祝日リストにあれば無効化
              }
            ]
          });
        })
        .catch(err => {
          // API取得失敗時は土日のみ無効化して安全にフォールバック
          flatpickr("#dateSelect", { locale: "ja", minDate: "today", disable: [ function(date) { return (date.getDay() === 0 || date.getDay() === 6); } ] });
        });

      // LIFFの初期化
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          liff.getProfile()
            .then(profile => {
              document.getElementById("profileImage").src = profile.pictureUrl || "https://via.placeholder.com/48";
              document.getElementById("profileName").innerText = profile.displayName + " さんとしてログイン中";
              document.getElementById("userName").value = profile.displayName;
            })
            .catch(err => console.error(err));
        })
        .catch(err => console.error(err));
    });

    function showModal(title, message) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalMessage").innerHTML = message;
      document.getElementById("customModal").style.display = "flex";
    }
    function closeModal() {
      document.getElementById("customModal").style.display = "none";
    }

    function submitSchedule() {
      const form = document.getElementById("scheduleForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const userName = document.getElementById("userName").value;
      const dateVal = document.getElementById("dateSelect").value;
      const timeVal = document.getElementById("timeSelect").value;
      const btn = document.getElementById("submitBtn");
      
      btn.disabled = true;
      btn.innerText = "送信中...";

      const messageText = `【面談希望日のご連絡】\nお名前：${userName}\n希望日：${dateVal}\n時間帯：${timeVal}\n\n※担当者からの返信をお待ちください。`;

      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: messageText }])
          .then(() => liff.closeWindow())
          .catch(() => {
            showModal("エラー", "メッセージの送信に失敗しました。");
            btn.disabled = false;
            btn.innerText = "この内容で送信してチャットへ";
          });
      } else {
        showModal("ブラウザで開かれています", `テスト環境のためチャット送信はスキップされました。<br><br>【送信内容】<br>${dateVal} ${timeVal}`);
        btn.disabled = false;
        btn.innerText = "この内容で送信してチャットへ";
      }
    }
  </script>
</body>
</html>
